# Single-binary Tempo for local development: OTLP in, filesystem storage.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m
  complete_block_timeout: 15s

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    # Keep this well under ingester.complete_block_timeout above -- otherwise
    # the querier doesn't learn about a just-flushed block for up to 5m
    # (Tempo's default poll), and a lookup in that gap 404s on a trace that
    # really does exist.
    blocklist_poll: 5s
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
