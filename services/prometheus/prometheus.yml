# Prometheus scrape configuration for the local stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  - job_name: common-app-base
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: common-app-base

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
