# Secret-scanning rules for Trivy.
# The local compose stack intentionally contains well-known development
# credentials. They are allow-listed by PATH, not by value, so a real secret
# committed anywhere else still fails the scan.
allow-rules:
  - id: compose-local-dev-defaults
    description: Documented local-only credentials in the dev compose stack and env template
    path: (deploy/compose/docker-compose\.yml|\.env\.example|deploy/k8s/.*\.yaml)$

  - id: build-log-gate-output
    description: BUILD_LOG.md quotes gate output containing local dev credentials
    path: (BUILD_LOG\.md|README\.md)$
