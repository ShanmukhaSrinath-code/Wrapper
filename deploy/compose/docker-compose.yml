# Common Application Base -- local stack.
# Grows one service per build phase; `docker compose up` must always work.
name: common-app-base

x-app-env: &app-env
  APP_NAME: common-app-base
  ENVIRONMENT: local
  LOG_LEVEL: INFO
  LOG_JSON: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: apppassword
  POSTGRES_DB: appdb

services:
  # --------------------------------------------------------------- app ------
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: common-app-base:local
    container_name: cab-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------- postgres ------
  postgres:
    image: postgres:16-alpine
    container_name: cab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
