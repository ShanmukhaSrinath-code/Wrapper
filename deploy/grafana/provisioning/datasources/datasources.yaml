apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      # Turn a trace_id in a log line into a click-through to the trace.
      derivedFields:
        - name: TraceID
          datasourceUid: ""
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]{32})"'
          url: "$${__value.raw}"

  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
      timeInterval: 15s
