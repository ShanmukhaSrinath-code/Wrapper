apiVersion: v1
kind: ConfigMap
metadata:
  name: common-app-base-config
data:
  # Non-secret configuration only. Anything sensitive belongs in the Secret.
  APP_NAME: common-app-base
  ENVIRONMENT: prod
  LOG_LEVEL: INFO
  LOG_JSON: "true"

  POSTGRES_HOST: postgres.data.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_USER: appuser
  POSTGRES_DB: appdb

  REDIS_HOST: redis.data.svc.cluster.local
  REDIS_PORT: "6379"
  CACHE_TTL_SECONDS: "60"

  STORAGE_PROVIDER: minio
  # In-cluster endpoint the app talks to.
  S3_ENDPOINT_URL: http://minio.data.svc.cluster.local:9000
  # Public endpoint presigned URLs must be signed for, because a browser
  # cannot resolve the in-cluster service name.
  S3_PUBLIC_ENDPOINT_URL: https://files.example.com
  S3_BUCKET: app-files

  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: common-app-base
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  METRICS_ENABLED: "true"

  CORS_ALLOW_ORIGINS: https://app.example.com
  CORS_ALLOW_CREDENTIALS: "true"
  MAX_REQUEST_BODY_BYTES: "10485760"
  HSTS_MAX_AGE_SECONDS: "31536000"

  # Swap point: set to azure_key_vault and add AZURE_KEY_VAULT_URL to move
  # secrets out of the cluster Secret entirely.
  SECRETS_PROVIDER: env
