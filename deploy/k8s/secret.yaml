apiVersion: v1
kind: Secret
metadata:
  name: common-app-base-secrets
type: Opaque
stringData:
  # -------------------------------------------------------------------------
  # PLACEHOLDERS ONLY. Never commit real credentials to this file.
  #
  # In production replace it with a reference to a real secret store:
  #   - External Secrets Operator, or
  #   - Sealed Secrets, or
  #   - the Azure Key Vault CSI driver, which pairs with
  #     SECRETS_PROVIDER=azure_key_vault in the ConfigMap.
  # -------------------------------------------------------------------------
  POSTGRES_PASSWORD: "REPLACE_ME"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  REDIS_PASSWORD: ""
  SENTRY_DSN: ""
