apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: common-app-base
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: common-app-base
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # React quickly to load.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Shed capacity slowly: flapping costs more than a few idle pods.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: common-app-base
spec:
  # Keeps a voluntary drain (node upgrade) from taking the service down.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: common-app-base
      app.kubernetes.io/component: api
