apiVersion: apps/v1
kind: Deployment
metadata:
  name: common-app-base
  labels:
    app.kubernetes.io/name: common-app-base
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # never drop below the desired count during a roll
  selector:
    matchLabels:
      app.kubernetes.io/name: common-app-base
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: common-app-base
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Give in-flight requests time to finish before the container stops.
      terminationGracePeriodSeconds: 30

      containers:
        - name: api
          image: ghcr.io/OWNER/common-app-base:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: common-app-base-config
            - secretRef:
                name: common-app-base-secrets

          # --- probes -----------------------------------------------------
          # startupProbe gates the other two, so a slow first boot (cold
          # caches, connection warm-up) is not mistaken for a crash loop.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30        # allows up to 150s to come up
            timeoutSeconds: 3

          # Liveness never touches a dependency: a slow database must not get
          # healthy pods killed and turn a partial outage into a total one.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness DOES check dependencies, so a pod that cannot reach
          # Postgres, Redis or MinIO is pulled out of the Service instead of
          # serving errors.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # No CPU limit on purpose: throttling degrades tail latency more
              # than it protects neighbours. Memory IS limited, because memory
              # is not a compressible resource.
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: common-app-base
              app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: common-app-base-worker
  labels:
    app.kubernetes.io/name: common-app-base
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: common-app-base
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: common-app-base
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Long enough for an in-flight task to finish rather than be re-queued.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/OWNER/common-app-base:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.jobs.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: common-app-base-config
            - secretRef:
                name: common-app-base-secrets
          # A worker serves no HTTP, so liveness asks Celery itself.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A app.jobs.celery_app:celery_app inspect ping -d celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
