name: CI

# lint -> test -> scan -> build -> push
# Each stage gates the next: a failing scan must not produce a pushed image.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- lint ----
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

  # ---------------------------------------------------------------- test ----
  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    needs: lint

    # The suite talks to real backing services rather than mocks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: appdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: app-files
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 10s --health-timeout 5s --health-retries 12

    env:
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      OTEL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Unit tests (no stack required)
        run: uv run pytest tests/unit -q

      - name: Start the API and a Celery worker
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            --no-server-header --proxy-headers --forwarded-allow-ips '*' &
          uv run celery -A app.core.jobs.celery_app:celery_app worker --loglevel=INFO &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health/ready && break
            sleep 2
          done

      - name: Integration tests
        run: uv run pytest tests/integration -q -m integration

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: End-to-end tests
        run: uv run pytest tests/e2e -q -m e2e

      - name: Coverage gate
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------- scan ----
  scan:
    name: Trivy (deps, secrets, misconfig)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Report everything to the Security tab...
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: trivy.yaml

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # ...and fail the build on HIGH/CRITICAL.
      - name: Trivy filesystem scan (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: trivy.yaml

  # --------------------------------------------------------------- build ----
  build:
    name: Build & scan image
    runs-on: ubuntu-latest
    needs: [test, scan]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      # Build locally first so the image is scanned BEFORE it can be pushed.
      - name: Build image (load, do not push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/app/Dockerfile
          push: false
          load: true
          tags: common-app-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: common-app-base:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Smoke-test the built image
        run: |
          docker run -d --name ci-smoke -p 8000:8000 common-app-base:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/live && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health/live | grep -q '"status":"ok"'
          # The correlation contract must hold in the shipped artefact too.
          curl -fsS -D - -o /dev/null http://localhost:8000/health/live | grep -i '^x-request-id'
          docker rm -f ci-smoke

      # ---- push (only from the default branch or a tag) ----
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------- deploy ----
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Rendering always runs, so a broken manifest fails CI even before a
      # cluster is wired up.
      - name: Render manifests
        run: kubectl kustomize deploy/k8s

      - name: Apply
        run: |
          echo "STUB: no cluster is wired up yet."
          echo "To enable, add a KUBE_CONFIG secret and replace this step with:"
          echo "  kubectl apply -k deploy/k8s"
          echo "  kubectl rollout status deployment/common-app-base --timeout=300s"
